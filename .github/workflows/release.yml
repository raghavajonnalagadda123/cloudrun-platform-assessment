name: build-plan-deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_production:
        description: "Continue through the protected production approval boundary"
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: cloudrun-release-${{ github.ref }}
  cancel-in-progress: false
env:
  REGION: ${{ vars.GCP_REGION }}
  AR_REPOSITORY: ${{ vars.AR_REPOSITORY }}
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image_uri: ${{ steps.image.outputs.uri }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
      - id: build
        uses: docker/build-push-action@ca877d9245402d1537745e0e356eab47c3520991 # v6.18.0
        with:
          context: .
          push: true
          tags: ${{ env.REGION }}-docker.pkg.dev/${{ vars.DEV_PROJECT_ID }}/${{ env.AR_REPOSITORY }}/sample-api:${{ github.sha }}
          provenance: true
          sbom: true
      - id: image
        name: Capture immutable artifact reference
        run: echo "uri=${REGION}-docker.pkg.dev/${{ vars.DEV_PROJECT_ID }}/${AR_REPOSITORY}/sample-api@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"
      - name: Release evidence
        run: |
          {
            echo "### Build evidence"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Immutable image: ${{ steps.image.outputs.uri }}"
          } >> "$GITHUB_STEP_SUMMARY"

  plan_dev:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: dev
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.9.8
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Set dev inputs
        run: |
          echo "TF_VAR_project_id=${{ vars.DEV_PROJECT_ID }}" >> "$GITHUB_ENV"
          echo "TF_VAR_image=${{ needs.build.outputs.image_uri }}" >> "$GITHUB_ENV"
          echo "TF_VAR_service_name=sample-api-dev" >> "$GITHUB_ENV"
          echo "TF_VAR_environment=dev" >> "$GITHUB_ENV"
          echo "TF_VAR_runtime_service_account_id=sample-api-dev-runtime" >> "$GITHUB_ENV"
          echo "TF_VAR_region=${REGION}" >> "$GITHUB_ENV"
      - run: |
          terraform -chdir=infra/envs/dev init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          terraform -chdir=infra/envs/dev plan -out=dev.tfplan
      - uses: actions/upload-artifact@v4
        with:
          name: dev-terraform-plan
          path: infra/envs/dev/dev.tfplan
          retention-days: 3

  apply_dev:
    needs: [build, plan_dev]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: dev
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.9.8
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: actions/download-artifact@v4
        with:
          name: dev-terraform-plan
          path: infra/envs/dev
      - run: terraform -chdir=infra/envs/dev init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
      - run: terraform -chdir=infra/envs/dev apply -auto-approve dev.tfplan

  plan_prod:
    if: github.event_name == 'push' || inputs.deploy_production
    needs: [build, apply_dev]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.9.8
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Set prod inputs
        run: |
          echo "TF_VAR_project_id=${{ vars.PROD_PROJECT_ID }}" >> "$GITHUB_ENV"
          echo "TF_VAR_image=${{ needs.build.outputs.image_uri }}" >> "$GITHUB_ENV"
          echo "TF_VAR_service_name=sample-api-prod" >> "$GITHUB_ENV"
          echo "TF_VAR_environment=prod" >> "$GITHUB_ENV"
          echo "TF_VAR_runtime_service_account_id=sample-api-prod-runtime" >> "$GITHUB_ENV"
          echo "TF_VAR_region=${REGION}" >> "$GITHUB_ENV"
      - run: |
          terraform -chdir=infra/envs/prod init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          terraform -chdir=infra/envs/prod plan -out=prod.tfplan
      - uses: actions/upload-artifact@v4
        with:
          name: prod-terraform-plan
          path: infra/envs/prod/prod.tfplan
          retention-days: 3

  apply_prod:
    if: github.event_name == 'push' || inputs.deploy_production
    needs: [build, plan_prod]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: prod
    concurrency:
      group: cloudrun-prod-terraform-apply
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.9.8
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: actions/download-artifact@v4
        with:
          name: prod-terraform-plan
          path: infra/envs/prod
      - run: terraform -chdir=infra/envs/prod init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
      - run: terraform -chdir=infra/envs/prod apply -auto-approve prod.tfplan
      - run: |
          {
            echo "### Production deployment"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Image: ${{ needs.build.outputs.image_uri }}"
            echo "- Approval enforced by protected GitHub Environment: prod"
          } >> "$GITHUB_STEP_SUMMARY"
